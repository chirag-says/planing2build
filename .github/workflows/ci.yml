# CI (ADR-014; ENVIRONMENT_AND_DEPLOYMENT section 5; TESTING_ARCHITECTURE section 6).
# Deploy jobs (GHCR push, staging, production) are added once the repository owner and the
# deploy approver are decided (baseline D-13, AQ-29).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  NODE_VERSION: "22"

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: p2b
          POSTGRES_PASSWORD: p2b_ci
          POSTGRES_DB: p2b_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U p2b -d p2b_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      P2B_DATABASE_URL: postgresql+asyncpg://p2b:p2b_ci@127.0.0.1:55432/p2b_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Format, lint, types, module boundaries
        run: |
          uv run ruff format --check src tests migrations scripts
          uv run ruff check src tests migrations scripts
          uv run mypy src tests scripts
          uv run lint-imports
      - name: Migrations upgrade, downgrade, upgrade on a fresh database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests with coverage gates (70% overall, 85% on services)
        run: |
          uv run pytest --cov --cov-report=term --cov-fail-under=70
          uv run coverage report --include="src/p2b/*/service.py" --fail-under=85
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes --format requirements-txt)
        shell: bash

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --frozen --no-dev
      - name: Regenerate the contract; fail if it differs from the committed one
        run: |
          pnpm contracts
          git diff --exit-code -- packages/contracts

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm test:web
      - run: pnpm --filter @p2b/web build
        env:
          P2B_HOST_IHB: ihb.localhost
          P2B_HOST_PRO: pro.localhost
          P2B_HOST_OPS: admin.localhost
      - run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --exit-code 1

  images:
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t p2b-api:ci apps/api
      - run: docker build -f apps/web/Dockerfile -t p2b-web:ci .
      - name: Trivy scan (high and critical block)
        run: |
          for image in p2b-api:ci p2b-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.0 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  e2e:
    runs-on: ubuntu-24.04
    needs: [api, web]
    env:
      P2B_HOST_IHB: ihb.localhost
      P2B_HOST_PRO: pro.localhost
      P2B_HOST_OPS: admin.localhost
      P2B_API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/local/compose.yml up -d --build --wait
      - run: pnpm --filter @p2b/web build
      - name: Start the web server for Caddy to reach
        run: |
          (pnpm --filter @p2b/web start --port 3000 --hostname 0.0.0.0 > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
      - run: pnpm --filter @p2b/web exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose -f infra/local/compose.yml logs
