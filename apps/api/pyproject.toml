[project]
name = "p2b-api"
version = "0.1.0"
description = "Plan2Build API and worker (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<2",
    "procrastinate>=3.10,<4",
    "psycopg[binary]>=3.3,<4",  # bundles libpq; the slim image has none
    "structlog>=26.1,<27",
    "sentry-sdk[fastapi]>=2,<3",
    "uuid-utils>=1.0,<2",
    "argon2-cffi>=25,<26",  # OTP code hashing (SECURITY 3.1)
    "cryptography>=46,<47",  # AES-GCM for the OTP delivery ciphertext
    "email-validator>=2.3,<3",  # email syntax and normalisation (pydantic EmailStr)
    "httpx>=0.28,<0.29",  # Resend and Nominatim adapters
    "geoalchemy2>=0.20,<0.21",  # PostGIS geography columns (plot pin)
    "boto3>=1.43,<2",  # S3 API for R2 (MinIO locally): presigned uploads and downloads
    "pillow>=12.3,<13",  # re-encode uploaded images, stripping EXIF and GPS
    "pikepdf>=10.16,<11",  # reject encrypted or script-bearing PDFs
    "fpdf2>=2.8,<3",  # render invoices and credit notes (Slice 3.3)
    "pyotp==2.9.0",
    "segno==1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
    "import-linter>=2.15,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2b"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT", "BLE", "DTZ"]
# Error class names mirror the API error codes (NotFound, StateConflict), by design.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "boto3.*", "botocore.*", "geoalchemy2.*", "pikepdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["p2b"]
branch = true
# SQLAlchemy async runs code inside greenlets; without this, lines after awaits go unmeasured.
concurrency = ["greenlet", "thread"]

# Module boundaries (IMPLEMENTATION_CONTRACT section 4; ADR-019).
[tool.importlinter]
root_package = "p2b"

[[tool.importlinter.contracts]]
name = "core imports no module"
type = "forbidden"
source_modules = ["p2b.core"]
forbidden_modules = [
    "p2b.identity", "p2b.audit", "p2b.catalog", "p2b.integrations", "p2b.projects", "p2b.documents",
    "p2b.operations", "p2b.construction", "p2b.specification", "p2b.notifications", "p2b.designs", "p2b.professionals",
    "p2b.billing", "p2b.engagements", "p2b.buildplan", "p2b.rfq", "p2b.money", "p2b.assurance", "p2b.records",
]

[[tool.importlinter.contracts]]
name = "integrations import no module"
type = "forbidden"
source_modules = ["p2b.integrations"]
forbidden_modules = [
    "p2b.identity", "p2b.audit", "p2b.catalog", "p2b.projects", "p2b.documents", "p2b.operations",
    "p2b.construction", "p2b.specification", "p2b.notifications", "p2b.designs", "p2b.professionals",
    "p2b.billing", "p2b.engagements", "p2b.buildplan", "p2b.rfq", "p2b.money", "p2b.assurance", "p2b.records",
]

[[tool.importlinter.contracts]]
name = "billing never touches professionals, construction or payment marks (no construction money, G.1)"
type = "forbidden"
source_modules = ["p2b.billing"]
forbidden_modules = [
    "p2b.professionals", "p2b.construction", "p2b.specification", "p2b.engagements",
    "p2b.buildplan", "p2b.rfq", "p2b.money", "p2b.assurance", "p2b.records",
]
# Billing reads projects through their interface, which knows the workspace; billing itself
# never imports these modules.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "modules talk to each other only through interface.py"
type = "independence"
modules = [
    "p2b.identity", "p2b.audit", "p2b.catalog", "p2b.projects", "p2b.documents", "p2b.operations",
    "p2b.construction", "p2b.specification", "p2b.notifications", "p2b.designs", "p2b.professionals",
    "p2b.billing", "p2b.engagements", "p2b.buildplan", "p2b.rfq", "p2b.money", "p2b.assurance", "p2b.records",
]
# Allowed: a module may call another module's interface.py, never its other files.
ignore_imports = [
    "p2b.** -> p2b.audit.interface",
    "p2b.** -> p2b.identity.interface",
    "p2b.** -> p2b.catalog.interface",
    "p2b.** -> p2b.projects.interface",
    "p2b.** -> p2b.documents.interface",
    "p2b.** -> p2b.construction.interface",
    "p2b.** -> p2b.specification.interface",
    "p2b.** -> p2b.professionals.interface",
    "p2b.** -> p2b.billing.interface",
    "p2b.** -> p2b.engagements.interface",
    "p2b.** -> p2b.buildplan.interface",
    "p2b.** -> p2b.designs.interface",
    "p2b.** -> p2b.rfq.interface",
    "p2b.** -> p2b.assurance.interface",
    "p2b.** -> p2b.money.interface",
    "p2b.** -> p2b.records.interface",
]
